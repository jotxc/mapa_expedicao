<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11304f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mapa EXP">
<title>Mapa EXP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2311304f'/%3E%3Cg fill='%234a8de0'%3E%3Crect x='12' y='12' width='16' height='16' rx='3'/%3E%3Crect x='36' y='12' width='16' height='16' rx='3'/%3E%3Crect x='12' y='36' width='16' height='16' rx='3'/%3E%3C/g%3E%3Crect x='36' y='36' width='16' height='16' rx='3' fill='%23d98324'/%3E%3C/svg%3E">
<style>
  :root {
    --fundo: #f2f4f7;
    --cartao: #ffffff;
    --texto: #1b2430;
    --texto-fraco: #5b6675;
    --borda: #d3d9e0;
    --ocupada: #2f6fd0;
    --ocupada-clara: #dbe7fa;
    --coleta: #1f9d55;
    --coleta-clara: #e2f4e9;
    --vazia: #eef1f4;
    --alerta: #d98324;
    --erro: #c0392b;
    --erro-clara: #fdecea;
    --toque: 58px;
    --planta-bg: #e7ebf0;
    --pos-bg: #f7f9fb;
    --pos-borda-vazia: #b9c2cc;
    --inconsistente-bg: #fff6e8;
    --painel-cabecalho: #e9eef4;
    --aviso-erro-bg: #fdecea;
    --aviso-erro-borda: #f0b4ad;
    --aviso-erro-txt: #7d241c;
    --aviso-alerta-bg: #fdf3e3;
    --aviso-alerta-borda: #f0d3a0;
    --aviso-alerta-txt: #7a5312;
  }

  [data-tema="escuro"] {
    --fundo: #0f1722;
    --cartao: #182230;
    --texto: #e7edf5;
    --texto-fraco: #93a3b8;
    --borda: #2c3a4d;
    --ocupada: #4a8de0;
    --ocupada-clara: #1d3350;
    --coleta: #3fbf76;
    --coleta-clara: #142a1e;
    --vazia: #1a2430;
    --alerta: #e0a34a;
    --erro: #e2685c;
    --erro-clara: #3a1f1d;
    --planta-bg: #0c141d;
    --pos-bg: #141d28;
    --pos-borda-vazia: #3a4a5e;
    --inconsistente-bg: #2e2617;
    --painel-cabecalho: #1f2b3a;
    --aviso-erro-bg: #3a1f1d;
    --aviso-erro-borda: #7d3b34;
    --aviso-erro-txt: #f0b4ad;
    --aviso-alerta-bg: #332912;
    --aviso-alerta-borda: #7a6122;
    --aviso-alerta-txt: #f0d3a0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: #11304f;
    color: #fff;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  }
  .marca-linha {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  header h1 { margin: 0; font-size: 1.15rem; letter-spacing: 0.3px; }
  header .subtitulo { margin: 4px 0 0; font-size: 0.72rem; color: #c6d4e4; line-height: 1.3; }
  .header-acoes { display: flex; gap: 6px; flex: 0 0 auto; }
  .botao-icone {
    min-height: 34px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid #33506e;
    background: transparent;
    color: #c6d4e4;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }
  .botao-icone.ativa { background: #2f6fd0; border-color: #2f6fd0; color: #fff; }

  .busca-linha { display: flex; gap: 8px; margin-top: 10px; }
  .busca-linha input {
    flex: 1;
    min-width: 0;
    font-size: 1rem;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #33506e;
    background: #0d2438;
    color: #fff;
  }
  .busca-linha input::placeholder { color: #8fa6bd; }

  .busca-acoes { display: flex; gap: 8px; margin-top: 8px; }
  .botao-primario {
    flex: 1;
    min-height: 46px;
    border: none;
    border-radius: 10px;
    background: #2f6fd0;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .botao-primario:disabled { background: #5b7087; opacity: 0.7; cursor: default; }
  .botao-secundario {
    min-height: 46px;
    border: 1px solid #33506e;
    border-radius: 10px;
    background: transparent;
    color: #c6d4e4;
    padding: 0 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .botao-secundario.ativa { background: #2f6fd0; border-color: #2f6fd0; color: #fff; }

  .resultados {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--cartao);
    color: var(--texto);
    border-top: 1px solid var(--borda);
    max-height: 48vh;
    overflow-y: auto;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
  }
  .resultado {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px 16px;
    border-bottom: 1px solid var(--borda);
    cursor: pointer;
  }
  .resultado input { width: 22px; height: 22px; margin-top: 2px; }
  .resultado-texto { font-size: 0.88rem; }
  .resultado-contagem { display: block; color: var(--texto-fraco); font-size: 0.74rem; margin-top: 2px; }

  main { padding: 12px 12px calc(64px + env(safe-area-inset-bottom, 0px)); }

  .aviso {
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 0.85rem;
    line-height: 1.35;
  }
  .aviso.erro { background: var(--aviso-erro-bg); border: 1px solid var(--aviso-erro-borda); color: var(--aviso-erro-txt); }
  .aviso.alerta { background: var(--aviso-alerta-bg); border: 1px solid var(--aviso-alerta-borda); color: var(--aviso-alerta-txt); }
  .aviso ul { margin: 6px 0 0; padding-left: 18px; }
  .aviso li { margin: 2px 0; }
  .aviso-sub { display: block; margin-top: 8px; }
  .aviso-item-clicavel {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 2px 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .aviso-item-clicavel:hover { text-decoration: underline; }
  .aviso-item-clicavel:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 4px; }
  .aviso-ir { display: block; font-size: 0.7rem; opacity: 0.75; margin-top: 1px; }

  .avisos { margin: 12px 0 0; }
  .aviso-cabecalho { display: flex; align-items: center; gap: 10px; }
  .aviso-cabecalho strong { flex: 1; }
  .aviso-entendido {
    flex: 0 0 auto;
    min-height: 30px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
  }
  .aviso-discreto {
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--borda);
    background: transparent;
    color: var(--texto-fraco);
    font: inherit;
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* Painel lateral: materiais filtrados + lotes (expande ao clicar) */
  .materiais-painel {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 10px;
    overflow: hidden;
  }
  .materiais-painel[hidden] { display: none; }
  .materiais-painel > h2 {
    margin: 0;
    padding: 11px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    background: var(--painel-cabecalho);
    color: var(--texto);
    border-bottom: 1px solid var(--borda);
  }
  .materiais-lista { display: flex; flex-direction: column; }
  .material-item { border-bottom: 1px solid var(--borda); }
  .material-item:last-child { border-bottom: none; }
  .material-item > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    cursor: pointer;
    list-style: none;
    font-size: 0.82rem;
  }
  .material-item > summary::-webkit-details-marker { display: none; }
  .material-item > summary::after {
    content: '\25B8';
    margin-left: auto;
    color: var(--texto-fraco);
    transition: transform 0.15s;
  }
  .material-item[open] > summary::after { transform: rotate(90deg); }
  .material-item[open] > summary { background: var(--painel-cabecalho); }
  .material-cor {
    width: 16px; height: 16px; border-radius: 4px; flex: 0 0 auto;
    border: 1px solid rgba(0, 0, 0, 0.25);
  }
  .material-nome { flex: 1; min-width: 0; }
  .material-contagem { display: block; color: var(--texto-fraco); font-size: 0.7rem; margin-top: 2px; }
  .material-remover {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid var(--borda);
    background: transparent;
    color: var(--texto-fraco);
    font-size: 1.05rem;
    line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .material-remover:hover { background: var(--alerta); color: #fff; border-color: var(--alerta); }
  .material-lotes { padding: 2px 12px 10px 32px; display: flex; flex-direction: column; gap: 4px; }
  .lote-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
  .lote-item input { width: 18px; height: 18px; }
  .lote-nome { flex: 1; }
  .lote-contagem { color: var(--texto-fraco); font-size: 0.72rem; }
  .lote-vazio { color: var(--texto-fraco); font-size: 0.78rem; margin: 4px 0; }
  .materiais-acoes { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--borda); }
  .materiais-acoes .botao-primario, .materiais-acoes .botao-secundario { flex: 1; min-height: 42px; }
  .materiais-acoes .botao-primario { background: #2f6fd0; color: #fff; border: none; }
  .materiais-acoes .botao-secundario { color: var(--texto-fraco); border-color: var(--borda); }

  /* Layout em colunas (mapa + painel lateral) */
  .layout { display: block; }
  .area-mapa { min-width: 0; position: relative; }
  .area-lateral { display: flex; flex-direction: column; gap: 12px; }

  /* Desktop: tela cheia (mapa + legenda + descrições), sem rolagem da página */
  @media (min-width: 1024px) {
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      padding: 10px 16px;
    }
    .marca-linha { flex: 0 0 auto; align-items: center; }
    header h1 { font-size: 1.05rem; }
    header .subtitulo { margin-top: 2px; font-size: 0.68rem; }
    .busca-linha { flex: 1 1 320px; margin: 0; }
    .busca-linha input { padding: 9px 12px; font-size: 0.95rem; }
    .busca-acoes { flex: 0 0 auto; margin: 0; }
    .botao-primario, .botao-secundario { min-height: 38px; }
    .botao-icone { min-height: 30px; padding: 0 8px; }

    /* Cabeçalho, mapa e rodapé ocupam a tela inteira */
    body {
      display: grid;
      grid-template-areas:
        "cabecalho"
        "mapa"
        "rodape";
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100dvh;
      overflow: hidden;
    }
    body > header { grid-area: cabecalho; position: relative; top: auto; }
    body > footer { grid-area: rodape; position: static; }

    main#mapa {
      grid-area: mapa;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 12px 16px;
      overflow: hidden;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      flex: 1 1 auto;
      min-height: 0;
      align-items: stretch;
    }
    .layout.com-painel {
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
    }
    .area-mapa { min-width: 0; min-height: 0; display: flex; }
    #planta-viewport { flex: 1 1 auto; max-height: none; min-height: 220px; }
    .area-lateral {
      display: none;
      flex-direction: column;
      min-height: 0;
      max-height: none;
      overflow: hidden;
    }
    .layout.com-painel .area-lateral { display: flex; }
    .materiais-painel { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
    .materiais-lista { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  }

  /* Celular (sem o layout de duas colunas): o mapa ocupa a área principal e
     os avisos + a lista de materiais ficam logo abaixo (rolando a página). */
  @media (max-width: 1023px) {
    /* Cabeçalho compacto: título+botões numa linha, busca+Aplicar na linha de baixo */
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      padding: 6px 10px;
      padding-top: calc(6px + env(safe-area-inset-top, 0px));
    }
    .marca-linha { flex: 1 1 100%; align-items: center; gap: 8px; }
    header h1 { font-size: 1.02rem; }
    header .subtitulo { margin-top: 1px; font-size: 0.64rem; }
    .botao-icone { min-height: 30px; padding: 0 8px; font-size: 0.68rem; }
    .busca-linha { flex: 1 1 auto; min-width: 0; margin: 0; }
    .busca-linha input { padding: 9px 12px; }
    .busca-acoes { flex: 0 0 auto; margin: 0; }
    .botao-primario, .botao-secundario { min-height: 40px; font-size: 0.85rem; }
    .botao-secundario { padding: 0 12px; }
    .resultados { max-height: 60vh; }

    main#mapa { display: flex; flex-direction: column; padding-top: 10px; }
    .layout { display: contents; }
    .area-mapa { order: 1; display: block; min-width: 0; }
    .area-lateral { order: 2; }
    #avisos { order: 3; }
    #planta-viewport {
      height: auto;
      max-height: calc(100dvh - var(--alt-cabecalho, 108px) - var(--alt-rodape, 46px) - 22px);
      min-height: 180px;
      max-width: 100%;
    }
  }

  /* Planta baixa (área da expedição) */
  #planta-viewport {
    position: relative;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y;
    scrollbar-width: thin;
    scrollbar-color: rgba(17, 48, 79, 0.5) transparent;
    border: 1px solid var(--borda);
    border-radius: 12px;
    background: var(--planta-bg);
  }
  #planta-viewport::-webkit-scrollbar { width: 10px; height: 10px; }
  #planta-viewport::-webkit-scrollbar-thumb {
    background: rgba(17, 48, 79, 0.45);
    border-radius: 6px;
  }
  #planta-viewport::-webkit-scrollbar-track { background: transparent; }
  .planta {
    display: block;
    width: max-content;
    padding: 10px 12px 14px;
    background: var(--planta-bg);
    transform-origin: 0 0;
  }
  .faixa-par { display: flex; flex-direction: column; }
  .fila-linha { display: flex; align-items: stretch; }
  .rotulo-fila {
    position: sticky;
    left: 0;
    z-index: 3;
    flex: 0 0 auto;
    width: 64px;
    display: flex;
    align-items: center;
    padding: 0 6px 0 2px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--texto);
    background: var(--planta-bg);
  }
  .quadrados { display: flex; gap: 3px; }

  /* Camada com as setas que apontam para pallets fora da área visível.
     Fica sobre o viewport (não rola com o conteúdo) e na altura da fila. */
  #sinais-borda {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  #sinais-borda[hidden] { display: none; }
  .sinal-borda {
    position: absolute;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 800;
    line-height: 1;
    color: #fff;
    background: var(--ocupada);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }
  .sinal-borda.direita { right: 6px; }
  .sinal-borda.esquerda { left: 6px; }
  .corredor { height: 34px; }

  /* Badge de "pallet fora da tela" quando há filtro: pílula fixa na borda
     direita da viewport com a cor do material, a posição e uma seta. */
  #indicador-busca {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 16px;
    background: #fff;
    color: #1b2430;
    font-size: 0.75rem;
    font-weight: 700;
    line-height: 1;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
    pointer-events: none;
  }
  #indicador-busca[hidden] { display: none; }
  .indicador-cor {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 1px solid rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .indicador-cor svg { width: 11px; height: 11px; display: block; }

  .posicao {
    position: relative;
    overflow: hidden;
    flex: 0 0 auto;
    width: var(--toque);
    height: var(--toque);
    border-radius: 10px;
    border: 2px solid var(--borda);
    background: var(--pos-bg);
    color: var(--texto);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    font: inherit;
  }
  .posicao:focus-visible { outline: 3px solid #2f6fd0; outline-offset: 2px; }
  .posicao .num, .posicao .marca {
    position: relative;
    z-index: 1;
    font-size: 0.82rem;
    font-weight: 600;
    line-height: 1;
  }
  .posicao .marca { margin-top: 3px; color: var(--texto-fraco); font-size: 0.68rem; }

  .posicao.ocupada { background: var(--ocupada-clara); border-color: var(--ocupada); }
  .posicao.vazia { background: var(--cartao); border-style: dashed; border-color: var(--pos-borda-vazia); }
  .posicao.inconsistente { background: var(--inconsistente-bg); border-color: var(--alerta); }
  .posicao.inconsistente .marca { color: var(--alerta); font-weight: 700; }

  /* Estados com filtro aplicado */
  .posicao.filtrado.atenuada { opacity: 0.35; filter: grayscale(1); }
  .posicao.filtrado.destacada { border-color: rgba(0, 0, 0, 0.25); }
  .posicao.filtrado .num {
    background: rgba(255, 255, 255, 0.9);
    color: #1b2430;
    border-radius: 4px;
    padding: 0 3px;
  }

  /* Pallet(is) coletado(s): posição fica esmaecida (apagada) com um V */
  .posicao.coletada {
    background: var(--vazia);
    border-style: dashed;
    border-color: var(--pos-borda-vazia);
    opacity: 0.45;
  }
  .posicao.coleta-parcial { border-color: var(--coleta); }
  .selo-coleta {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.86rem;
    font-weight: 800;
    line-height: 1;
    border-radius: 999px;
    background: var(--coleta);
    color: #fff;
    margin: auto;
    width: 26px;
    height: 26px;
  }
  .posicao.coleta-parcial .selo-coleta {
    inset: 2px 2px auto auto;
    width: 16px;
    height: 16px;
    font-size: 0.56rem;
  }

  footer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--cartao);
    border-top: 1px solid var(--borda);
    padding: 8px 12px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 0.72rem;
    color: var(--texto-fraco);
  }
  footer .legenda { display: flex; align-items: center; gap: 5px; }
  footer .amostra {
    width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--borda);
    display: inline-block;
  }

<header>

    </div>

  <div class="busca-linha">
    <input id="busca" type="search" autocomplete="off"
           placeholder="Material, descrição, UD ou lote">

<main id="mapa"></main>

<section id="upload" class="upload" hidden>

    <p class="upload-dica">
      Selecione a exportação da LX02 (<strong>.xlsx</strong>) e o PDF consolidado
      da bipagem (<strong>filas.pdf</strong>) — ou o TXT do coletor. Nada é
      enviado a servidor: tudo é processado aqui no seu aparelho.
    </p>

    <label class="upload-campo">
      <span>LX02 (.xlsx)</span>

    <div id="upload-area" class="upload-area" tabindex="0">

    </div>
