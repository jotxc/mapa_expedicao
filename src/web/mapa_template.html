<!-- Núcleo de leitura (LX02/PDF/TXT) — espelha mapa_dados.py -->
<script>/*__MAPA_CORE__*/</script>

<script>
  // Os dados são injetados aqui pelo gerar_mapa_html.py
  // (variável mutável: a tela de upload pode preenchê-la no navegador)
  let DADOS_MAPA = __DADOS_MAPA__;

  // Identidade do app (usada quando os dados vêm do upload no navegador)
  const APP = {
    marca: 'Mapa EXP',
    subtitulo: 'Expedição — Conferência de pallets',
    versao: '1.0',
  };

  // Cores usadas para destacar os materiais selecionados.
  // Ordem pensada para que materiais vizinhos (1º, 2º, 3º...) fiquem o mais
  // diferentes possível entre si (alterna quente/frio e claro/escuro).
  const PALETA = [
    '#e6194b', // vermelho
    '#1f5fd0', // azul
    '#2ca02c', // verde
    '#ff7f0e', // laranja
    '#7b2ff7', // roxo
    '#17becf', // ciano
    '#e6199e', // magenta
    '#c9a227', // dourado
    '#8b0000', // vinho
    '#00806b', // verde-água escuro
    '#ff69b4', // rosa
    '#2f2f8f', // azul-marinho
    '#6b8e23', // oliva
    '#8c564b', // marrom
    '#4b0082', // índigo
    '#00b3a4', // turquesa
    '#d2691e', // chocolate
    '#c71585', // rosa-escuro
    '#4682b4', // azul-aço
    '#808080', // cinza
  ];

  // Quando houver mais materiais do que cores, reforça com listras/faixas.
  const PADROES = [
    '', // variante 0: cor sólida
    'repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.5) 0 4px, transparent 4px 9px)',
    'repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.8) 0 4px, transparent 4px 9px)',
    'repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.45) 0 4px, transparent 4px 9px)',
  ];

  // Fundo de um material: a cor (variante 0) ou cor + padrão (repetições).
  function fundoMaterial(material) {
    const info = ESTADO.cores[material];
    if (!info) return 'transparent';
    const padrao = PADROES[info.variante % PADROES.length] || '';
    return padrao ? `${padrao}, ${info.cor}` : info.cor;
  }

  const ESTADO = {
    selecionados: [],   // códigos de material escolhidos, na ordem
    cores: {},          // material -> { cor }
    filtroAtivo: false,
    lotes: {},          // material -> Set de lotes aplicados no mapa
    lotesPendentes: {}, // material -> Set de lotes marcados no painel
    materiaisExpandidos: new Set(), // materiais com lotes abertos no painel
    avisosOcultos: false, // usuário tocou "Entendido" nos avisos
    coletados: new Set(), // chaves dos pallets já coletados (persistido no aparelho)
  };

  // Identifica um pallet para marcar a coleta (UD é o identificador do pallet).
  // Sem UD, usa fila-posição-nível como identificador estável do endereço.
  function chaveColeta(pallet, posicao) {
    const ud = pallet.ud === null || pallet.ud === undefined ? '' : String(pallet.ud).trim();
    if (ud) return `ud:${ud}`;
    return `pos:${posicao.fila}-${posicao.posicao}-${pallet.empilhamento}`;
  }

  function palletsOrdenados(posicao) {
    return [...(posicao.pallets || [])].sort((a, b) => a.empilhamento - b.empilhamento);
  }

  // A marcação de coleta vale para a "remessa" atual (mesma marca + geração).
  // Trocar os arquivos do dia gera novo carimbo e começa zerado.
  function chaveArmazenamentoColeta() {
    const dados = DADOS_MAPA || {};
    return `mapa-exp-coletados::${dados.marca || APP.marca}::${dados.gerado_em || ''}`;
  }

  function carregarColetados() {
    ESTADO.coletados = new Set();
    try {
      const bruto = localStorage.getItem(chaveArmazenamentoColeta());
      if (bruto) JSON.parse(bruto).forEach(chave => ESTADO.coletados.add(String(chave)));
    } catch (erro) { /* armazenamento indisponível: segue sem persistir */ }
  }

  function salvarColetados() {
    try {
      localStorage.setItem(chaveArmazenamentoColeta(),
        JSON.stringify([...ESTADO.coletados]));
    } catch (erro) { /* ignora */ }
  }

  // --- Sessão do dia (mapa + adições manuais) ---
  // Guarda o payload inteiro no aparelho, para o operador reabrir o arquivo
  // sem precisar subir tudo de novo. Um novo upload substitui a sessão.
  const CHAVE_SESSAO = 'mapa-exp-sessao';

  function salvarSessao(dados) {
    dados = dados || DADOS_MAPA;
    if (!dados) return;
    try {
      localStorage.setItem(CHAVE_SESSAO, JSON.stringify(dados));
    } catch (erro) { /* armazenamento cheio/indisponível: segue sem persistir */ }
  }

  function carregarSessao() {
    try {
      const bruto = localStorage.getItem(CHAVE_SESSAO);
      if (!bruto) return null;
      const dados = JSON.parse(bruto);
      if (!dados || !Array.isArray(dados.filas)) return null;
      return dados;
    } catch (erro) { return null; }
  }

  // Lote pode vir como número no JSON; usar sempre texto evita erro de tipo.
  function chaveLote(lote) {
    return lote === null || lote === undefined ? '' : String(lote);
  }

  const NOMES_NIVEL = { 1: 'pallet de baixo', 2: 'pallet de cima' };

  function escapar(valor) {
    const div = document.createElement('div');
    div.textContent = valor === null || valor === undefined ? '—' : String(valor);
    return div.innerHTML;
  }

  function normalizar(texto) {
    return String(texto === null || texto === undefined ? '' : texto)
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  // Índice "fila-posicao" -> dados da posição (para focar via avisos)
  const POSICOES_POR_CHAVE = {};
  function construirIndicePosicoes() {
    Object.keys(POSICOES_POR_CHAVE).forEach(chave => { delete POSICOES_POR_CHAVE[chave]; });
    DADOS_MAPA.filas.forEach(fila => fila.posicoes.forEach(posicao => {
      POSICOES_POR_CHAVE[fila.fila + '-' + posicao.posicao] = posicao;
    }));
  }

  // --- Catálogo de materiais (para a busca e o painel de lotes) ---
  function montarCatalogo() {
    const porMaterial = new Map();
    const pallets = [];

    DADOS_MAPA.filas.forEach(fila => fila.posicoes.forEach(posicao => {
      posicao.pallets.forEach(pallet => {
        pallets.push({
          material: pallet.material,
          descricao: pallet.descricao,
          ud: pallet.ud,
          lote: pallet.lote,
        });
        if (pallet.material === null) return;
        if (!porMaterial.has(pallet.material)) {
          porMaterial.set(pallet.material, {
            material: pallet.material,
            descricao: pallet.descricao,
            pallets: 0,
            posicoes: new Set(),
            lotes: new Map(), // lote -> quantidade de pallets
          });
        }
        const item = porMaterial.get(pallet.material);
        item.pallets += 1;
        item.posicoes.add(fila.fila + '-' + posicao.posicao);
        const lote = chaveLote(pallet.lote);
        item.lotes.set(lote, (item.lotes.get(lote) || 0) + 1);
      });
    }));

    return { porMaterial, pallets, itens: [...porMaterial.values()] };
  }

  let CATALOGO = null;
  function inicializarDados() {
    construirIndicePosicoes();
    CATALOGO = montarCatalogo();
    carregarColetados();
  }

  function materiaisQueCasam(termo) {
    const alvo = normalizar(termo);
    const conjunto = new Set();
    CATALOGO.pallets.forEach(pallet => {
      if (pallet.material === null) return;
      if (normalizar(pallet.material).includes(alvo) ||
          normalizar(pallet.descricao).includes(alvo) ||
          normalizar(pallet.ud).includes(alvo) ||
          normalizar(pallet.lote).includes(alvo)) {
        conjunto.add(pallet.material);
      }
    });
    return conjunto;
  }

  // --- Resultados da busca ---
  function itemResultadoHTML(item) {
    const marcado = ESTADO.selecionados.includes(item.material) ? 'checked' : '';
    return `<label class="resultado">
      <input type="checkbox" value="${escapar(item.material)}" ${marcado}>
      <span class="resultado-texto">
        <strong>${escapar(item.material)}</strong> — ${escapar(item.descricao || '(sem descrição)')}
        <span class="resultado-contagem">${item.pallets} pallet(s) · ${item.posicoes.size} posição(ões)</span>
      </span>
    </label>`;
  }

  function atualizarResultados() {
    const caixa = document.getElementById('resultados');
    const termo = document.getElementById('busca').value.trim();

    if (!termo) {
      caixa.hidden = true;
      caixa.innerHTML = '';
      return;
    }

    const casam = materiaisQueCasam(termo);
    const itens = CATALOGO.itens.filter(item => casam.has(item.material));

    if (!itens.length) {
      caixa.innerHTML = '<p class="sem-dados">Nenhum material encontrado.</p>';
      caixa.hidden = false;
      return;
    }

    caixa.innerHTML = itens.map(itemResultadoHTML).join('');
    caixa.hidden = false;

    caixa.querySelectorAll('input[type=checkbox]').forEach(caixaSelecao => {
      caixaSelecao.addEventListener('change', () => {
        alternarSelecao(caixaSelecao.value, caixaSelecao.checked);
      });
    });
  }

  function alternarSelecao(material, marcado) {
    const posicao = ESTADO.selecionados.indexOf(material);
    if (marcado && posicao === -1) ESTADO.selecionados.push(material);
    if (!marcado && posicao !== -1) ESTADO.selecionados.splice(posicao, 1);
    atualizarBotoes();
  }

  function atualizarBotoes() {
    const aplicar = document.getElementById('aplicar');
    const quantidade = ESTADO.selecionados.length;
    aplicar.disabled = quantidade === 0;
    aplicar.textContent = quantidade
      ? `Aplicar (${quantidade})`
      : 'Aplicar';
    document.getElementById('limpar-filtro').hidden = !ESTADO.filtroAtivo;
  }

  function aplicarFiltro() {
    ESTADO.cores = {};
    ESTADO.lotes = {};
    ESTADO.lotesPendentes = {};
    ESTADO.selecionados.forEach((material, indice) => {
      ESTADO.cores[material] = {
        cor: PALETA[indice % PALETA.length],
        variante: Math.floor(indice / PALETA.length),
      };
      const item = CATALOGO.porMaterial.get(material);
      const todos = new Set(item ? item.lotes.keys() : []);
      ESTADO.lotes[material] = new Set(todos);
      ESTADO.lotesPendentes[material] = new Set(todos);
    });
    ESTADO.filtroAtivo = ESTADO.selecionados.length > 0;
    ESTADO.materiaisExpandidos.clear();

    document.getElementById('busca').value = '';
    document.getElementById('resultados').hidden = true;

    renderizarMapa();
  }

  function limparFiltro() {
    ESTADO.selecionados = [];
    ESTADO.cores = {};
    ESTADO.lotes = {};
    ESTADO.lotesPendentes = {};
    ESTADO.filtroAtivo = false;

    document.getElementById('busca').value = '';
    document.getElementById('resultados').hidden = true;

    atualizarBotoes();
    renderizarMapa();
  }

  function rotuloLote(lote) {
    return lote === '' ? '(sem lote)' : lote;
  }

  // --- Painel lateral: materiais filtrados; clicar no material expande os lotes ---
  function renderizarPainelMateriais() {
    const painel = document.getElementById('painel-materiais');
    const layout = document.getElementById('layout');
    if (!painel) return;

    if (!ESTADO.filtroAtivo) {
      painel.hidden = true;
      painel.innerHTML = '';
      if (layout) layout.classList.remove('com-painel');
      return;
    }

    const blocos = ESTADO.selecionados.map(material => {
      const item = CATALOGO.porMaterial.get(material);
      const pallets = item ? item.pallets : 0;
      const lotes = item ? item.lotes.size : 0;
      const nome = escapar(item && item.descricao ? item.descricao : '(sem descrição)');
      const aberto = ESTADO.materiaisExpandidos.has(material);

      return `<details class="material-item" data-material="${escapar(material)}"${aberto ? ' open' : ''}>
        <summary>
          <span class="material-cor" style="background:${fundoMaterial(material)}"></span>
          <span class="material-nome">
            ${nome}
            <span class="material-contagem">${pallets} pallet(s) · ${lotes} lote(s) · cód. ${escapar(material)}</span>
          </span>
          <button type="button" class="material-remover" data-material="${escapar(material)}" aria-label="Excluir material do filtro" title="Excluir material">&times;</button>
        </summary>
        <div class="material-lotes" data-material="${escapar(material)}">${aberto ? listaLotesHTML(material) : ''}</div>
      </details>`;
    }).join('');

    painel.hidden = false;
    if (layout) layout.classList.add('com-painel');
    painel.innerHTML =
      '<h2>Materiais</h2>' +
      `<div class="materiais-lista">${blocos}</div>` +
      '<div class="materiais-acoes">' +
        '<button type="button" class="botao-primario" id="aplicar-lotes">Aplicar lotes</button>' +
        '<button type="button" class="botao-secundario" id="marcar-lotes">Marcar todos</button>' +
      '</div>';

    // Os lotes só são gerados ao expandir cada material (evita travar com muitos).
    painel.querySelectorAll('details.material-item').forEach(detalhe => {
      detalhe.addEventListener('toggle', () => {
        const material = detalhe.dataset.material;
        const corpo = detalhe.querySelector('.material-lotes');
        if (detalhe.open) {
          ESTADO.materiaisExpandidos.add(material);
          if (corpo && !corpo.innerHTML.trim()) corpo.innerHTML = listaLotesHTML(material);
        } else {
          ESTADO.materiaisExpandidos.delete(material);
        }
      });
    });

    // Delegação: um único listener para todas as caixas de lote.
    painel.onchange = evento => {
      const caixa = evento.target;
      if (!caixa || caixa.type !== 'checkbox') return;
      const conjunto = ESTADO.lotesPendentes[caixa.dataset.material];
      if (!conjunto) return;
      if (caixa.checked) conjunto.add(caixa.dataset.lote);
      else conjunto.delete(caixa.dataset.lote);
    };

    // Excluir um material direto do painel (botão "×" no cabeçalho do material).
    painel.querySelectorAll('.material-remover').forEach(botao => {
      botao.addEventListener('click', evento => {
        evento.preventDefault();
        evento.stopPropagation();
        removerMaterial(botao.dataset.material);
      });
    });
    document.getElementById('aplicar-lotes').addEventListener('click', aplicarLotes);
    document.getElementById('marcar-lotes').addEventListener('click', marcarTodosLotes);
  }

  // Remove um material do filtro e recria cores/mapa.
  function removerMaterial(material) {
    ESTADO.selecionados = ESTADO.selecionados.filter(m => m !== material);
    delete ESTADO.cores[material];
    delete ESTADO.lotes[material];
    delete ESTADO.lotesPendentes[material];
    ESTADO.materiaisExpandidos.delete(material);

    if (!ESTADO.selecionados.length) limparFiltro();
    else aplicarFiltro();
  }

  function listaLotesHTML(material) {
    const item = CATALOGO.porMaterial.get(material);
    const marcados = ESTADO.lotesPendentes[material] || new Set();
    const lotes = [...(item ? item.lotes.keys() : [])]
      .sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true }));
    return lotes.map(lote => {
      const ativo = marcados.has(lote);
      const quantos = item.lotes.get(lote);
      return `<label class="lote-item">
        <input type="checkbox" data-material="${escapar(material)}" data-lote="${escapar(lote)}" ${ativo ? 'checked' : ''}>
        <span class="lote-nome">Lote ${escapar(rotuloLote(lote))}</span>
        <span class="lote-contagem">${quantos} pallet(s)</span>
      </label>`;
    }).join('') || '<p class="lote-vazio">Sem lote.</p>';
  }

  function marcarTodosLotes() {
    ESTADO.selecionados.forEach(material => {
      const item = CATALOGO.porMaterial.get(material);
      ESTADO.lotesPendentes[material] = new Set(item ? item.lotes.keys() : []);
    });
    renderizarPainelMateriais();
  }

  function aplicarLotes() {
    ESTADO.lotes = {};
    ESTADO.selecionados.forEach(material => {
      ESTADO.lotes[material] = new Set(ESTADO.lotesPendentes[material] || []);
    });
    renderizarMapa();
  }

  // Materiais selecionados que casam com esta posição (respeitando os lotes)
  function materiaisCasadosNaPosicao(posicao) {
    return ESTADO.selecionados.filter(material =>
      posicao.pallets.some(pallet =>
        pallet.material === material &&
        ESTADO.cores[pallet.material] &&
        ESTADO.lotes[pallet.material] &&
        ESTADO.lotes[pallet.material].has(chaveLote(pallet.lote))));
  }

  // --- Mapa (planta baixa: 1 quadrado por posição) ---
  function criarPosicao(posicao) {
    const botao = document.createElement('button');
    let classes = `posicao ${posicao.estado}`;

    // Sem filtro o quadrado mostra só o número; "vazia" e "!" informam o estado
    let marca = '';
    if (posicao.estado === 'vazia') marca = 'vazia';
    else if (posicao.estado === 'inconsistente') marca = '!';

    if (ESTADO.filtroAtivo) {
      classes += ' filtrado';

      const materiaisCasados = materiaisCasadosNaPosicao(posicao);

      if (!materiaisCasados.length) {
        classes += ' atenuada';
      } else {
        classes += ' destacada';
        if (materiaisCasados.length === 1) {
          botao.style.background = fundoMaterial(materiaisCasados[0]);
        } else {
          // Dois materiais na mesma posição: metade diagonal de cada cor
          const cores = materiaisCasados.map(m => ESTADO.cores[m].cor);
          botao.style.background =
            `linear-gradient(135deg, ${cores[0]} 50%, ${cores[1]} 50%)`;
        }
      }
    }

    botao.className = classes;
    botao.dataset.fila = posicao.fila;
    botao.dataset.posicao = posicao.posicao;
    botao.setAttribute('aria-label',
      `Fila ${posicao.fila}, posição ${posicao.posicao}, ${posicao.estado}`);
    botao.setAttribute('aria-haspopup', 'dialog');
    botao.addEventListener('click', evento => {
      evento.stopPropagation();
      if (botaoSelecionado === botao && !document.getElementById('painel').hidden) {
        fecharPainel();
      } else {
        abrirPainel(posicao, botao);
      }
    });

    const numero = String(posicao.posicao).padStart(2, '0');
    botao.innerHTML =
      `<span class="num">${numero}</span>` +
      (marca ? `<span class="marca">${escapar(marca)}</span>` : '');
    atualizarSeloColeta(botao, posicao);
    return botao;
  }

  // Quantos pallets da posição já foram coletados (0..total)
  function contarColetados(posicao) {
    return (posicao.pallets || []).filter(pallet =>
      ESTADO.coletados.has(chaveColeta(pallet, posicao))).length;
  }

  // Atualiza o selo de coleta (V cheio ou contagem parcial) sem recriar a posição
  function atualizarSeloColeta(botao, posicao) {
    const total = (posicao.pallets || []).length;
    const coletados = contarColetados(posicao);
    botao.classList.toggle('coletada', total > 0 && coletados === total);
    botao.classList.toggle('coleta-parcial', coletados > 0 && coletados < total);

    let selo = botao.querySelector('.selo-coleta');
    if (coletados > 0) {
      if (!selo) {
        selo = document.createElement('span');
        selo.className = 'selo-coleta';
        botao.appendChild(selo);
      }
      selo.textContent = coletados === total ? '\u2713' : `${coletados}/${total}`;
    } else if (selo) {
      selo.remove();
    }
  }

  function atualizarVisualPosicao(posicao) {
    const botao = document.querySelector(
      `.posicao[data-fila="${posicao.fila}"][data-posicao="${posicao.posicao}"]`);
    if (botao) atualizarSeloColeta(botao, posicao);
  }

  // Marca/desmarca a posição inteira como coletada (todos os pallets de uma vez).
  // Na ida ao endereço o operador leva a pilha toda, então é um toque só.
  function alternarColetaPosicao(posicao) {
    const pallets = posicao.pallets || [];
    if (!pallets.length) return;
    const todosColetados = pallets.every(pallet =>
      ESTADO.coletados.has(chaveColeta(pallet, posicao)));
    pallets.forEach(pallet => {
      const chave = chaveColeta(pallet, posicao);
      if (todosColetados) ESTADO.coletados.delete(chave);
      else ESTADO.coletados.add(chave);
    });
    salvarColetados();
    atualizarVisualPosicao(posicao);
    renderizarRodape();
  }

  function renderizarLinhaFila(fila) {
    const linha = document.createElement('div');
    linha.className = 'fila-linha';
    linha.dataset.fila = fila.fila;

    const rotulo = document.createElement('div');
    rotulo.className = 'rotulo-fila';
    rotulo.textContent = `FILA ${fila.fila}`;

    const quadrados = document.createElement('div');
    quadrados.className = 'quadrados';
    fila.posicoes.forEach(posicao => quadrados.appendChild(criarPosicao(posicao)));

    linha.appendChild(rotulo);
    linha.appendChild(quadrados);
    return linha;
  }

  // --- Resumo da expedição (mostrado de forma compacta no rodapé) ---
  function calcularResumo() {
    let pallets = 0;
    let coletados = 0;
    let ocupadas = 0;
    let vazias = 0;
    let inconsistentes = 0;

    DADOS_MAPA.filas.forEach(fila => fila.posicoes.forEach(posicao => {
      const total = (posicao.pallets || []).length;
      const jaColetados = contarColetados(posicao);
      pallets += total;
      coletados += jaColetados;
      // Posição com tudo coletado conta como livre (os pallets saíram do chão)
      if (posicao.estado === 'vazia' || (total > 0 && jaColetados === total)) {
        vazias += 1;
      } else if (posicao.estado === 'ocupada') {
        ocupadas += 1;
      } else {
        inconsistentes += 1;
      }
    }));

    const totalPosicoes = ocupadas + vazias + inconsistentes;
    const ocupacao = totalPosicoes
      ? Math.round((ocupadas / totalPosicoes) * 100)
      : 0;
    return { pallets, ocupadas, vazias, inconsistentes, coletados, totalPosicoes, ocupacao };
  }

  // --- Avisos (problemas e alertas), com atalho para a posição ---
  function itemAvisoHTML(item) {
    const mensagem = typeof item === 'string' ? item : item.mensagem;
    const temFila = item && item.fila !== undefined && item.fila !== null;
    const temPosicao = item && item.posicao !== undefined && item.posicao !== null;
    if (typeof item !== 'string' && temFila && temPosicao) {
      return `<li><button type="button" class="aviso-item-clicavel"
        data-fila="${item.fila}" data-posicao="${item.posicao}">
        ${escapar(mensagem)}<span class="aviso-ir">ver no mapa</span>
      </button></li>`;
    }
    return `<li>${escapar(mensagem)}</li>`;
  }

  function avisosContagem() {
    return ((DADOS_MAPA.problemas ? DADOS_MAPA.problemas.length : 0) +
      (DADOS_MAPA.alertas ? DADOS_MAPA.alertas.length : 0));
  }

  // Conteúdo interno da caixa de avisos (muda conforme "Entendido").
  function avisosInternoHTML() {
    const problemas = DADOS_MAPA.problemas || [];
    const alertas = DADOS_MAPA.alertas || [];
    const total = problemas.length + alertas.length;
    if (ESTADO.avisosOcultos) {
      return `<button type="button" id="avisos-abrir" class="aviso-discreto">` +
        `Avisos (${total}) — toque para ver</button>`;
    }
    const severidade = problemas.length ? 'erro' : 'alerta';
    const blocos = [];
    if (problemas.length) {
      blocos.push('<strong class="aviso-sub">Problemas encontrados:</strong>' +
        `<ul>${problemas.map(itemAvisoHTML).join('')}</ul>`);
    }
    if (alertas.length) {
      blocos.push('<strong class="aviso-sub">Alertas:</strong>' +
        `<ul>${alertas.map(itemAvisoHTML).join('')}</ul>`);
    }
    return `<div class="aviso ${severidade}" aria-live="polite">` +
      '<div class="aviso-cabecalho">' +
        `<strong>${total} aviso(s) — posições afetadas marcadas com !</strong>` +
        '<button type="button" id="avisos-entendido" class="aviso-entendido">Entendido</button>' +
      '</div>' +
      blocos.join('') +
      '</div>';
  }

  function renderizarAvisos() {
    if (!avisosContagem()) return '';
    return `<div id="avisos" class="avisos">${avisosInternoHTML()}</div>`;
  }

  function atualizarAvisos() {
    const caixa = document.getElementById('avisos');
    if (!caixa) return;
    caixa.innerHTML = avisosInternoHTML();
    conectarAvisosClicaveis();
    conectarAvisosBotoes();
  }

  function conectarAvisosClicaveis() {
    document.querySelectorAll('.aviso-item-clicavel').forEach(botao => {
      botao.addEventListener('click', () => {
        focarPosicao(Number(botao.dataset.fila), Number(botao.dataset.posicao));
      });
    });
  }

  function conectarAvisosBotoes() {
    const entendido = document.getElementById('avisos-entendido');
    if (entendido) {
      entendido.addEventListener('click', () => {
        ESTADO.avisosOcultos = true;
        atualizarAvisos();
      });
    }
    const abrir = document.getElementById('avisos-abrir');
    if (abrir) {
      abrir.addEventListener('click', () => {
        ESTADO.avisosOcultos = false;
        atualizarAvisos();
      });
    }
  }

  // Foca uma posição no mapa e abre os detalhes
  function focarPosicao(fila, posicao) {
    const botao = document.querySelector(
      `.posicao[data-fila="${fila}"][data-posicao="${posicao}"]`);
    if (!botao) return;
    botao.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    const dados = POSICOES_POR_CHAVE[fila + '-' + posicao];
    if (dados) {
      window.setTimeout(() => abrirPainel(dados, botao), 320);
    }
  }

  function renderizarMapa() {
    const conteudo = document.getElementById('mapa');
    let html = renderizarAvisos();

    if (!DADOS_MAPA.filas.length) {
      html += '<p class="sem-dados">Nenhuma posição para exibir.</p>';
      conteudo.innerHTML = html;
      conectarAvisosClicaveis();
      conectarAvisosBotoes();
      renderizarPainelMateriais();
      atualizarBotoes();
      medirAlturas();
      return;
    }

    html += `<div class="layout" id="layout">
      <div class="area-mapa">
        <div id="planta-viewport"><div class="planta" id="planta"></div></div>
        <div id="sinais-borda" hidden></div>
        <div id="indicador-busca" hidden></div>
      </div>
      <aside class="area-lateral" id="area-lateral">
        <section class="materiais-painel" id="painel-materiais" hidden></section>
      </aside>
    </div>`;
    // Preserva a rolagem atual da planta (o innerHTML abaixo a zera).
    const viewportAnterior = document.getElementById('planta-viewport');
    const rolagemEsquerda = viewportAnterior ? viewportAnterior.scrollLeft : 0;
    const rolagemTopo = viewportAnterior ? viewportAnterior.scrollTop : 0;
    conteudo.innerHTML = html;

    const planta = document.getElementById('planta');
    const porFila = new Map(DADOS_MAPA.filas.map(fila => [fila.fila, fila]));
    // De cima para baixo: Fila 6 -> Fila 1 (a Fila 1 fica embaixo)
    const numeros = [...porFila.keys()].sort((a, b) => b - a);

    // Pares colados: (5,6), (3,4), (1,2); com um vão entre os pares
    for (let i = 0; i < numeros.length; i += 2) {
      if (i > 0) {
        const corredor = document.createElement('div');
        corredor.className = 'corredor';
        planta.appendChild(corredor);
      }
      const faixa = document.createElement('div');
      faixa.className = 'faixa-par';
      numeros.slice(i, i + 2).forEach(n => faixa.appendChild(renderizarLinhaFila(porFila.get(n))));
      planta.appendChild(faixa);
    }

    plantaEl = planta;
    aplicarZoom(); // mantém a escala atual no elemento novo (evita flash em zoom 1)
    const viewportNovo = document.getElementById('planta-viewport');
    if (viewportNovo && (rolagemEsquerda || rolagemTopo)) {
      viewportNovo.scrollLeft = rolagemEsquerda;
      viewportNovo.scrollTop = rolagemTopo;
    }
    conectarAvisosClicaveis();
    conectarAvisosBotoes();
    renderizarPainelMateriais();
    atualizarBotoes();
    ajustarZoomInicial();
    medirAlturas();
    atualizarSinaisLaterais();
  }

  // Coloca setas flutuantes nas bordas do viewport, na altura (Y) de cada fila
  // que tem pallet não coletado fora da área visível. Direita = há pallet mais à
  // direita; esquerda = há pallet mais à esquerda. Desaparecem ao chegar no pallet.
  function atualizarSinaisLaterais() {
    const viewport = document.getElementById('planta-viewport');
    const camada = document.getElementById('sinais-borda');
    if (!viewport || !camada) return;
    const areaViewport = viewport.getBoundingClientRect();
    const area = camada.getBoundingClientRect(); // container da camada
    if (!areaViewport.width || !area.height) { camada.hidden = true; return; }

    camada.innerHTML = '';
    camada.hidden = false;
    const esquerdaVisivel = areaViewport.left + 2;
    const direitaVisivel = areaViewport.right - 2;

    document.querySelectorAll('.fila-linha').forEach(linha => {
      const alvos = linha.querySelectorAll(
        '.posicao.ocupada:not(.coletada):not(.coleta-parcial)');
      if (!alvos.length) return;

      let foraDireita = false;
      let foraEsquerda = false;
      let topoY = null;
      Array.prototype.forEach.call(alvos, pos => {
        const r = pos.getBoundingClientRect();
        if (!r.width) return;
        if (r.left >= direitaVisivel) foraDireita = true;
        else if (r.right <= esquerdaVisivel) foraEsquerda = true;
        else if (topoY === null) topoY = r.top;
      });
      if (topoY === null && (foraDireita || foraEsquerda)) {
        // Nenhum pallet visível agora: ancora na altura média da fila.
        const rl = linha.getBoundingClientRect();
        topoY = rl.top + rl.height / 2;
      }
      const y = Math.min(Math.max(topoY - area.top, 14), area.height - 14);

      const criar = (lado, seta) => {
        const sinal = document.createElement('div');
        sinal.className = `sinal-borda ${lado}`;
        sinal.style.top = `${y}px`;
        sinal.textContent = seta;
        sinal.title = lado === 'direita'
          ? 'Há pallet mais à direita nesta fila'
          : 'Há pallet mais à esquerda nesta fila';
        camada.appendChild(sinal);
      };
      if (foraDireita) criar('direita', '\u203A');
      if (foraEsquerda) criar('esquerda', '\u2039');
    });
    atualizarIndicadorBusca();
  }

  // Ícone de pallet em SVG (branco), usado só dentro do badge de busca.
  const ICONE_PALLET_SVG =
    '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">' +
    '<rect x="1" y="9" width="14" height="3" rx="0.6" fill="#fff"/>' +
    '<rect x="2" y="12.6" width="2.4" height="2.4" rx="0.5" fill="#fff"/>' +
    '<rect x="6.8" y="12.6" width="2.4" height="2.4" rx="0.5" fill="#fff"/>' +
    '<rect x="11.6" y="12.6" width="2.4" height="2.4" rx="0.5" fill="#fff"/>' +
    '<rect x="2" y="4.4" width="5.2" height="4" rx="0.7" fill="#fff" opacity="0.9"/>' +
    '<rect x="8.6" y="2.6" width="5.4" height="5.8" rx="0.7" fill="#fff" opacity="0.75"/>' +
    '</svg>';

  // Badge global na borda direita: com filtro ativo, mostra o match mais
  // próximo (à direita) que está fora da viewport. Some quando o pallet alvo
  // entra na tela ou o filtro é limpo. As setas ›‹ genéricas não são afetadas.
  function atualizarIndicadorBusca() {
    const badge = document.getElementById('indicador-busca');
    const viewport = document.getElementById('planta-viewport');
    if (!badge || !viewport) return;

    if (!ESTADO.filtroAtivo) { badge.hidden = true; return; }

    const area = viewport.getBoundingClientRect();
    if (!area.width) { badge.hidden = true; return; }
    const direitaVisivel = area.right - 2;

    let alvo = null;
    let alvoEsquerda = Infinity;
    document.querySelectorAll('.posicao.destacada:not(.coletada):not(.coleta-parcial)')
      .forEach(pos => {
        const r = pos.getBoundingClientRect();
        // Alvo = ainda não entrou totalmente pela borda direita (inclui o que
        // está só meio visível). Passou totalmente para a esquerda: ignorado.
        if (!r.width || r.right <= direitaVisivel) return;
        if (r.left < alvoEsquerda) { alvo = pos; alvoEsquerda = r.left; }
      });

    if (!alvo) { badge.hidden = true; return; }

    const numero = String(alvo.dataset.posicao).padStart(2, '0');
    badge.innerHTML =
      `<span class="indicador-cor" style="background:${alvo.style.background}">` +
      `${ICONE_PALLET_SVG}</span>` +
      `<span>Pos. ${numero}</span>` +
      '<span aria-hidden="true">\u2192</span>';
    badge.hidden = false;
  }

  // --- Zoom da planta (auto-enquadrar no desktop) ---
  const ZOOM_MIN = 0.25;
  const ZOOM_MAX = 2;
  let escalaZoom = 1;
  let plantaEl = null;

  function aplicarZoom() {
    if (plantaEl) plantaEl.style.zoom = escalaZoom;
  }

  function definirZoom(novo) {
    escalaZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, novo));
    aplicarZoom();
  }

  function zoomCaber() {
    const viewport = document.getElementById('planta-viewport');
    if (!viewport || !plantaEl) return false;
    // Mede o tamanho natural sem alternar o zoom (evita reflow duplo e pulo visual).
    const escalaAtual = escalaZoom || 1;
    const retangulo = plantaEl.getBoundingClientRect();
    const largura = retangulo.width / escalaAtual;
    const altura = retangulo.height / escalaAtual;
    if (largura <= 0 || altura <= 0) return false;
    let escala = (viewport.clientWidth - 4) / largura;
    const disponivelAltura = viewport.clientHeight - 4;
    if (disponivelAltura > 0) escala = Math.min(escala, disponivelAltura / altura);
    const anterior = escalaZoom;
    definirZoom(escala);
    return Math.abs(escalaZoom - anterior) > 0.001;
  }

  // Enquadra a planta automaticamente (somente no desktop).
  // Reenquadra em no máximo 3 frames, parando assim que a escala estabilizar
  // (a scrollbar pode aparecer/desaparecer entre medições, mudando o clientWidth).
  function ajustarZoomInicial() {
    if (!window.matchMedia('(min-width: 1024px)').matches) return;
    let tentativas = 0;
    const passo = () => {
      tentativas += 1;
      const mudou = zoomCaber();
      if (mudou && tentativas < 3) window.requestAnimationFrame(passo);
    };
    window.requestAnimationFrame(passo);
  }

  // --- Balão de detalhes da posição ---
  let botaoSelecionado = null;

  function balaoItemHTML(pallet, posicao) {
    const coletado = ESTADO.coletados.has(chaveColeta(pallet, posicao));
    const tag = pallet.manual ? ' <span class="balao-tag">adicionado</span>' : '';
    const remover = `<button type="button" class="balao-remover" data-emp="${pallet.empilhamento}">Remover</button>`;
    return `<div class="balao-item${coletado ? ' coletado' : ''}">
      <div class="balao-nome">${escapar(pallet.descricao)}${tag}</div>
      <div class="balao-cod">Cód. ${escapar(pallet.material)}</div>
      <div class="balao-lote">Lote ${escapar(pallet.lote)}</div>
      ${remover}
    </div>`;
  }

  function balaoAdicionarHTML() {
    return `<div class="balao-add">
      <button type="button" class="balao-add-abrir" id="balao-add-abrir">+ Adicionar pallet</button>
      <div class="balao-add-form" id="balao-add-form" hidden>
        <input type="search" id="balao-material" class="balao-busca" placeholder="Material ou descrição" autocomplete="off">
        <div class="balao-sugestoes" id="balao-sugestoes"></div>
        <div class="balao-lotes" id="balao-lotes" hidden></div>
        <input type="text" id="balao-ud" class="balao-ud" inputmode="numeric" maxlength="10" placeholder="UD (opcional)">
        <p class="balao-add-erro" id="balao-add-erro" hidden></p>
        <div class="balao-add-acoes">
          <button type="button" class="botao-primario" id="balao-add-confirmar" disabled>Adicionar</button>
          <button type="button" class="botao-secundario" id="balao-add-cancelar">Cancelar</button>
        </div>
      </div>
    </div>`;
  }

  function conteudoBalao(posicao) {
    const pallets = palletsOrdenados(posicao);
    let html = pallets.length
      ? pallets.map(pallet => balaoItemHTML(pallet, posicao)).join('')
      : '<p class="balao-vazio">Posição vazia</p>';

    const temLivres = (DADOS_MAPA.lx02_livres || []).length > 0;
    if (pallets.length < 2 && temLivres) html += balaoAdicionarHTML();

    if (pallets.length) {
      const todosColetados = contarColetados(posicao) === pallets.length;
      html += `<button type="button" class="balao-coleta" aria-pressed="${todosColetados ? 'true' : 'false'}">
        ${todosColetados ? '\u2713 Coletado' : 'Marcar coletado'}
      </button>`;
    }
    return html;
  }

  // Liga a coleta, o remover e o formulário de adicionar pallet.
  function conectarBalao(posicao) {
    const coletar = document.querySelector('#painel-conteudo .balao-coleta');
    if (coletar) coletar.addEventListener('click', evento => {
      evento.stopPropagation();
      alternarColetaPosicao(posicao);
      atualizarBalao(posicao);
    });

    document.querySelectorAll('#painel-conteudo .balao-remover').forEach(botao => {
      botao.addEventListener('click', evento => {
        evento.stopPropagation();
        removerPalletManual(posicao, Number(botao.dataset.emp));
      });
    });

    const abrir = document.getElementById('balao-add-abrir');
    const form = document.getElementById('balao-add-form');
    if (abrir) abrir.addEventListener('click', evento => {
      evento.stopPropagation();
      abrirFormularioAdd();
    });
    const cancelar = document.getElementById('balao-add-cancelar');
    if (cancelar) cancelar.addEventListener('click', evento => {
      evento.stopPropagation();
      if (form) form.hidden = true;
      if (abrir) abrir.hidden = false;
    });
    const confirmar = document.getElementById('balao-add-confirmar');
    if (confirmar) confirmar.addEventListener('click', evento => {
      evento.stopPropagation();
      adicionarPalletNaPosicao(posicao);
    });
    if (form) form.addEventListener('click', evento => evento.stopPropagation());

    const busca = document.getElementById('balao-material');
    if (busca) {
      busca.addEventListener('input', renderSugestoesBalao);
      busca.addEventListener('focus', renderSugestoesBalao);
    }
    const ud = document.getElementById('balao-ud');
    if (ud) ud.addEventListener('keydown', evento => {
      if (evento.key === 'Enter') {
        evento.preventDefault();
        adicionarPalletNaPosicao(posicao);
      }
    });
  }

  // --- Adicionar/remover pallet manualmente ---
  let BALAO_ADD = { indice: null, material: null, lote: null };

  // Índice material -> { descricao, lotes: Map(lote -> pallets livres) }.
  function livresIndex() {
    const porMaterial = new Map();
    (DADOS_MAPA.lx02_livres || []).forEach(item => {
      if (item.material === null || item.material === undefined) return;
      const material = String(item.material);
      if (!porMaterial.has(material)) {
        porMaterial.set(material, { material, descricao: item.descricao, lotes: new Map() });
      }
      const info = porMaterial.get(material);
      if (!info.descricao && item.descricao) info.descricao = item.descricao;
      (item.lotes || []).forEach(itemLote => {
        const chave = chaveLote(itemLote.lote);
        info.lotes.set(chave, (info.lotes.get(chave) || 0) + (Number(itemLote.pallets) || 0));
      });
    });
    return porMaterial;
  }

  function totalLotes(info) {
    let total = 0;
    info.lotes.forEach(quantidade => { total += quantidade; });
    return total;
  }

  function materiaisLivresQueCasam(termo, indice) {
    const alvo = normalizar(termo);
    const achados = [];
    indice.forEach(info => {
      if (!alvo || normalizar(info.material).includes(alvo) ||
          normalizar(info.descricao).includes(alvo)) {
        achados.push(info);
      }
    });
    achados.sort((a, b) =>
      String(a.material).localeCompare(String(b.material), 'pt-BR', { numeric: true }));
    return achados;
  }

  function abrirFormularioAdd() {
    BALAO_ADD = { indice: livresIndex(), material: null, lote: null };
    const abrir = document.getElementById('balao-add-abrir');
    const form = document.getElementById('balao-add-form');
    if (abrir) abrir.hidden = true;
    if (form) form.hidden = false;
    const erro = document.getElementById('balao-add-erro');
    if (erro) erro.hidden = true;
    const lotes = document.getElementById('balao-lotes');
    if (lotes) { lotes.hidden = true; lotes.innerHTML = ''; }
    const ud = document.getElementById('balao-ud');
    if (ud) ud.value = '';
    const busca = document.getElementById('balao-material');
    if (busca) busca.value = '';
    renderSugestoesBalao();
    atualizarConfirmarBalao();
    if (busca) busca.focus();
  }

  function renderSugestoesBalao() {
    const caixa = document.getElementById('balao-sugestoes');
    if (!caixa) return;
    const campoBusca = document.getElementById('balao-material');
    const termo = campoBusca ? campoBusca.value : '';
    const achados = materiaisLivresQueCasam(termo, BALAO_ADD.indice || new Map()).slice(0, 30);
    if (!achados.length) {
      caixa.innerHTML = '<p class="lote-vazio">Nenhum material disponível.</p>';
      return;
    }
    caixa.innerHTML = achados.map(info => {
      const selecionado = info.material === BALAO_ADD.material ? ' selecionado' : '';
      return `<button type="button" class="balao-sugestao${selecionado}" data-material="${escapar(info.material)}">
        <strong>${escapar(info.material)}</strong> — ${escapar(info.descricao || '(sem descrição)')}
        <span class="balao-sugestao-sub">${totalLotes(info)} pallet(s) livre(s)</span>
      </button>`;
    }).join('');
    caixa.querySelectorAll('.balao-sugestao').forEach(botao => {
      botao.addEventListener('click', () => selecionarMaterialBalao(botao.dataset.material));
    });
  }

  function selecionarMaterialBalao(material) {
    BALAO_ADD.material = material;
    BALAO_ADD.lote = null;
    document.querySelectorAll('.balao-sugestao').forEach(botao => {
      botao.classList.toggle('selecionado', botao.dataset.material === material);
    });
    renderLotesBalao();
    atualizarConfirmarBalao();
  }

  function renderLotesBalao() {
    const caixa = document.getElementById('balao-lotes');
    if (!caixa) return;
    const info = BALAO_ADD.material
      ? (BALAO_ADD.indice || new Map()).get(BALAO_ADD.material)
      : null;
    if (!info) { caixa.hidden = true; caixa.innerHTML = ''; return; }
    const lotes = [...info.lotes.keys()].sort((a, b) =>
      a.localeCompare(b, 'pt-BR', { numeric: true }));
    caixa.hidden = false;
    caixa.innerHTML = '<span class="balao-rotulo">Lote</span>' + lotes.map(lote => {
      const selecionado = lote === BALAO_ADD.lote ? ' selecionado' : '';
      return `<button type="button" class="balao-lote-op${selecionado}" data-lote="${escapar(lote)}">
        <span>Lote ${escapar(rotuloLote(lote))}</span>
        <span class="balao-lote-op-sub">${info.lotes.get(lote)} livre(s)</span>
      </button>`;
    }).join('');
    caixa.querySelectorAll('.balao-lote-op').forEach(botao => {
      botao.addEventListener('click', () => selecionarLoteBalao(botao.dataset.lote));
    });
    if (lotes.length === 1) selecionarLoteBalao(lotes[0]);
  }

  function selecionarLoteBalao(lote) {
    BALAO_ADD.lote = lote;
    document.querySelectorAll('.balao-lote-op').forEach(botao => {
      botao.classList.toggle('selecionado', botao.dataset.lote === lote);
    });
    atualizarConfirmarBalao();
  }

  function atualizarConfirmarBalao() {
    const botao = document.getElementById('balao-add-confirmar');
    if (botao) botao.disabled = !(BALAO_ADD.material && BALAO_ADD.lote !== null);
  }

  function mostrarErroBalao(mensagem) {
    const caixa = document.getElementById('balao-add-erro');
    if (!caixa) return;
    caixa.textContent = mensagem;
    caixa.hidden = false;
  }

  function udJaUsada(ud) {
    const alvo = String(ud);
    let achou = false;
    DADOS_MAPA.filas.forEach(fila => fila.posicoes.forEach(posicao => {
      (posicao.pallets || []).forEach(pallet => {
        if (pallet.ud !== null && pallet.ud !== undefined && String(pallet.ud) === alvo) {
          achou = true;
        }
      });
    }));
    return achou;
  }

  // Desconta 1 pallet livre do material+lote (após adicionar manualmente).
  function debitarLivre(material, lote) {
    const lista = DADOS_MAPA.lx02_livres || [];
    for (let i = 0; i < lista.length; i++) {
      if (String(lista[i].material) !== String(material)) continue;
      const chave = chaveLote(lote);
      lista[i].lotes = (lista[i].lotes || []).filter(itemLote => {
        if (chaveLote(itemLote.lote) !== chave) return true;
        itemLote.pallets = Math.max(0, (Number(itemLote.pallets) || 0) - 1);
        return itemLote.pallets > 0;
      });
      if (!lista[i].lotes.length) lista.splice(i, 1);
      break;
    }
  }

  // Devolve 1 pallet ao estoque livre (após remover um pallet manual).
  function creditarLivre(material, lote, descricao) {
    if (material === null || material === undefined) return;
    if (!DADOS_MAPA.lx02_livres) DADOS_MAPA.lx02_livres = [];
    const lista = DADOS_MAPA.lx02_livres;
    let info = lista.find(item => String(item.material) === String(material));
    if (!info) {
      info = { material: material, descricao: descricao || null, lotes: [] };
      lista.push(info);
    }
    const chave = chaveLote(lote);
    let itemLote = (info.lotes || []).find(item => chaveLote(item.lote) === chave);
    if (!itemLote) { itemLote = { lote: chave, pallets: 0 }; info.lotes.push(itemLote); }
    itemLote.pallets = (Number(itemLote.pallets) || 0) + 1;
  }

  function adicionarPalletNaPosicao(posicao) {
    const material = BALAO_ADD.material;
    if (!material) return;
    const lote = BALAO_ADD.lote === null ? '' : BALAO_ADD.lote;
    const info = (BALAO_ADD.indice || new Map()).get(material);
    const campoUd = document.getElementById('balao-ud');
    const udDigitada = campoUd ? campoUd.value.trim() : '';
    const erro = document.getElementById('balao-add-erro');
    if (erro) erro.hidden = true;

    if (posicao.pallets.length >= 2) {
      return mostrarErroBalao('A posição já tem 2 pallets.');
    }
    if (udDigitada) {
      if (!/^\d{10}$/.test(udDigitada)) {
        return mostrarErroBalao('A UD deve ter 10 dígitos.');
      }
      if (udJaUsada(udDigitada)) {
        return mostrarErroBalao('Essa UD já está no mapa.');
      }
    }

    posicao.pallets.push({
      ud: udDigitada || null,
      empilhamento: posicao.pallets.length + 1,
      material: material,
      descricao: info ? info.descricao : null,
      lote: lote === '' ? null : lote,
      estoque: null,
      umb: null,
      data_em: null,
      data_venc: null,
      inconsistente: false,
      manual: true,
    });
    posicao.pallets.sort((a, b) => a.empilhamento - b.empilhamento);
    posicao.estado = 'ocupada';
    debitarLivre(material, lote);
    redesenharComPainel(posicao.fila, posicao.posicao);
  }

  function removerPalletManual(posicao, empilhamento) {
    const alvo = posicao.pallets.find(
      pallet => pallet.empilhamento === empilhamento);
    if (!alvo) return;
    posicao.pallets = posicao.pallets.filter(pallet => pallet !== alvo);
    posicao.pallets
      .sort((a, b) => a.empilhamento - b.empilhamento)
      .forEach((pallet, indice) => { pallet.empilhamento = indice + 1; });
    posicao.estado = posicao.pallets.length ? 'ocupada' : 'vazia';
    creditarLivre(alvo.material, alvo.lote, alvo.descricao);
    redesenharComPainel(posicao.fila, posicao.posicao);
  }

  // Salva a sessão, redesenha e reabre o balão da posição (mantém o contexto).
  function redesenharComPainel(fila, posicao) {
    salvarSessao();
    inicializarDados();
    renderizarMapa();
    renderizarRodape();
    const botao = document.querySelector(
      `.posicao[data-fila="${fila}"][data-posicao="${posicao}"]`);
    const dados = POSICOES_POR_CHAVE[fila + '-' + posicao];
    if (botao && dados) abrirPainel(dados, botao);
  }

  function posicionarBalao(balao, botao) {
    const r = botao.getBoundingClientRect();
    const largura = balao.offsetWidth;
    const altura = balao.offsetHeight;
    const margem = 8;

    const header = document.querySelector('header');
    const rodapeEl = document.getElementById('rodape');
    const topoMin = (header && header.offsetHeight ? header.offsetHeight : 0) + margem;
    const baseMax = (rodapeEl && !rodapeEl.hidden ? rodapeEl.offsetHeight : 0) + margem;

    let esquerda = r.left + r.width / 2 - largura / 2;
    esquerda = Math.max(margem, Math.min(esquerda, window.innerWidth - largura - margem));

    const teto = topoMin;
    const piso = Math.max(teto, window.innerHeight - baseMax - altura);

    let topo = r.top - altura - margem;
    if (topo < teto) {
      const abaixo = r.bottom + margem;
      topo = abaixo + altura <= window.innerHeight - baseMax ? abaixo : piso;
    }
    topo = Math.max(teto, Math.min(topo, piso));

    balao.style.left = `${esquerda}px`;
    balao.style.top = `${topo}px`;
  }

  // Redesenha o conteúdo do balão mantendo a posição (usado ao coletar)
  function atualizarBalao(posicao) {
    const balao = document.getElementById('painel');
    if (!balao || balao.hidden) return;
    document.getElementById('painel-conteudo').innerHTML = conteudoBalao(posicao);
    conectarBalao(posicao);
    if (botaoSelecionado) posicionarBalao(balao, botaoSelecionado);
  }

  function abrirPainel(posicao, botao) {
    const balao = document.getElementById('painel');
    document.getElementById('painel-conteudo').innerHTML = conteudoBalao(posicao);
    conectarBalao(posicao);
    balao.hidden = false;

    if (botaoSelecionado) botaoSelecionado.classList.remove('selecionada');
    botaoSelecionado = botao || null;
    if (botaoSelecionado) botaoSelecionado.classList.add('selecionada');

    posicionarBalao(balao, botao);
  }

  function fecharPainel() {
    document.getElementById('painel').hidden = true;
    if (botaoSelecionado) {
      botaoSelecionado.classList.remove('selecionada');
      botaoSelecionado = null;
    }
  }

  // Mede a altura do cabeçalho/rodapé para o mapa preencher a área do celular.
  function medirAlturas() {
    const raiz = document.documentElement;
    const header = document.querySelector('header');
    const rodape = document.getElementById('rodape');
    if (header && !header.hidden) {
      raiz.style.setProperty('--alt-cabecalho', `${header.offsetHeight}px`);
    }
    if (rodape && !rodape.hidden) {
      raiz.style.setProperty('--alt-rodape', `${rodape.offsetHeight}px`);
    }
  }

  function renderizarRodape() {
    const r = calcularResumo();
    document.getElementById('rodape').innerHTML =
      '<span class="legenda"><span class="amostra ocupada"></span>ocupada</span>' +
      '<span class="legenda"><span class="amostra vazia"></span>vazia</span>' +
      '<span class="legenda"><span class="amostra inconsistente"></span>sem dados confiáveis</span>' +
      (r.coletados > 0
        ? '<span class="legenda"><span class="amostra coletada"></span>coletado</span>'
        : '') +
      `<span class="legenda resumo-rodape">${r.pallets} pallets · ` +
      `${r.ocupacao}% ocupado · ${r.vazias} livres` +
      (r.coletados > 0 ? ` · ${r.coletados} coletado(s)` : '') +
      '</span>';
    medirAlturas();
  }

  // --- Tema claro / escuro ---
  function aplicarTema(tema) {
    document.documentElement.dataset.tema = tema;
    try { localStorage.setItem('mapa-exp-tema', tema); } catch (erro) { /* ignora */ }
    const botao = document.getElementById('botao-tema');
    if (botao) botao.textContent = tema === 'escuro' ? 'Claro' : 'Escuro';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', tema === 'escuro' ? '#0f1722' : '#11304f');
  }

  function alternarTema() {
    const atual = document.documentElement.dataset.tema === 'escuro' ? 'claro' : 'escuro';
    aplicarTema(atual);
  }

  function temaInicial() {
    let tema = 'claro';
    try { tema = localStorage.getItem('mapa-exp-tema') || 'claro'; } catch (erro) { /* ignora */ }
    aplicarTema(tema);
  }

  // --- Manifest (PWA) para "adicionar à tela inicial" ---
  function registrarManifest() {
    const marca = (DADOS_MAPA && DADOS_MAPA.marca) || APP.marca;
    const subtitulo = (DADOS_MAPA && DADOS_MAPA.subtitulo) || APP.subtitulo;
    const manifest = {
      name: `${marca} — ${subtitulo}`,
      short_name: marca,
      start_url: '.',
      display: 'standalone',
      background_color: '#f2f4f7',
      theme_color: '#11304f',
      icons: [],
    };
    try {
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const antigo = document.querySelector('link[rel="manifest"]');
      if (antigo) antigo.remove();
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    } catch (erro) { /* ambiente sem suporte */ }
  }

  // --- Tela de upload (processa tudo no navegador, sem servidor) ---
  const UPLOAD = { lx02: null, coletor: [] };
  let uploadIniciado = false;
  let workerPdfOk = false;

  function prepararWorkerPdf() {
    if (workerPdfOk || typeof pdfjsLib === 'undefined') return;
    try {
      const alvo = document.getElementById('pdfjs-worker-b64');
      const b64 = ((alvo && alvo.textContent) || '').trim();
      if (!b64) return;
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/javascript' }));
      pdfjsLib.GlobalWorkerOptions.workerSrc = url;
      workerPdfOk = true;
    } catch (erro) { /* usa o worker padrão do navegador */ }
  }

  function lerArrayBuffer(arquivo) {
    return arquivo.arrayBuffer();
  }

  function lerTexto(arquivo) {
    return arquivo.text();
  }

  async function extrairLinhasDoPdf(arquivo) {
    prepararWorkerPdf();
    const ab = await lerArrayBuffer(arquivo);
    const doc = await pdfjsLib.getDocument({
      data: new Uint8Array(ab),
      isEvalSupported: false,
    }).promise;
    const linhas = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const pagina = await doc.getPage(p);
      const conteudo = await pagina.getTextContent();
      const doPagina = MapaCore.linhasDeItens(conteudo.items);
      for (let i = 0; i < doPagina.length; i++) linhas.push(doPagina[i]);
    }
    try { await doc.destroy(); } catch (erro) { /* ignora */ }
    return linhas;
  }

  function formatarAgora() {
    const agora = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${p(agora.getDate())}/${p(agora.getMonth() + 1)}/${agora.getFullYear()} ` +
      `${p(agora.getHours())}:${p(agora.getMinutes())}`;
  }

  function classificarArquivo(nome) {
    const extensao = (nome.split('.').pop() || '').toLowerCase();
    if (extensao === 'xlsx' || extensao === 'xls') return 'lx02';
    if (extensao === 'pdf') return 'pdf';
    if (extensao === 'txt') return 'txt';
    return 'outro';
  }

  function renderizarListaUpload() {
    const lista = document.getElementById('upload-lista');
    const itens = [];
    if (UPLOAD.lx02) itens.push({ tipo: 'LX02', nome: UPLOAD.lx02.name });
    UPLOAD.coletor.forEach((f) => {
      itens.push({ tipo: classificarArquivo(f.name).toUpperCase(), nome: f.name });
    });
    if (!itens.length) {
      lista.hidden = true;
      lista.innerHTML = '';
      return;
    }
    lista.hidden = false;
    lista.innerHTML = itens.map((item) =>
      `<li><span class="tipo">${escapar(item.tipo)}</span><span class="nome">${escapar(item.nome)}</span></li>`
    ).join('');
    document.getElementById('upload-processar').disabled =
      !(UPLOAD.lx02 && UPLOAD.coletor.length);
  }

  function adicionarArquivos(arquivos) {
    const msgs = [];
    for (let i = 0; i < arquivos.length; i++) {
      const arquivo = arquivos[i];
      const tipo = classificarArquivo(arquivo.name);
      if (tipo === 'lx02') {
        UPLOAD.lx02 = arquivo;
      } else if (tipo === 'pdf' || tipo === 'txt') {
        UPLOAD.coletor.push(arquivo);
      } else {
        msgs.push({ tipo: 'erro', mensagem: `Formato não suportado: ${arquivo.name}` });
      }
    }
    mostrarMsgsUpload(msgs);
    renderizarListaUpload();
  }

  function mostrarMsgsUpload(msgs) {
    const caixa = document.getElementById('upload-msgs');
    if (!msgs || !msgs.length) {
      caixa.hidden = true;
      caixa.innerHTML = '';
      return;
    }
    caixa.hidden = false;
    caixa.innerHTML = msgs.map((m) =>
      `<div class="msg ${m.tipo === 'erro' ? 'erro' : 'aviso'}">${escapar(m.mensagem)}</div>`
    ).join('');
  }

  function abrirTelaUpload() {
    document.querySelector('header').hidden = true;
    document.getElementById('mapa').hidden = true;
    document.getElementById('rodape').hidden = true;
    document.getElementById('upload').hidden = false;
    document.getElementById('upload-cancelar').hidden = !DADOS_MAPA;
    renderizarListaUpload();
  }

  function voltarAoMapa() {
    if (!DADOS_MAPA) return;
    document.getElementById('upload').hidden = true;
    document.querySelector('header').hidden = false;
    document.getElementById('mapa').hidden = false;
    document.getElementById('rodape').hidden = false;
  }

  async function processarUpload() {
    const progresso = document.getElementById('upload-progresso');
    const progressoTxt = document.getElementById('upload-progresso-txt');
    const msgs = [];

    document.getElementById('upload-processar').disabled = true;
    progresso.hidden = false;
    progressoTxt.textContent = 'Lendo a LX02…';

    let lx02 = null;
    if (!UPLOAD.lx02) {
      mostrarMsgsUpload([{ tipo: 'erro', mensagem: 'Selecione a exportação da LX02 (.xlsx).' }]);
      document.getElementById('upload-processar').disabled = false;
      progresso.hidden = true;
      return;
    }
    try {
      const ab = await lerArrayBuffer(UPLOAD.lx02);
      lx02 = MapaCore.carregarLx02(ab);
    } catch (erro) {
      msgs.push({ tipo: 'erro', mensagem: 'Falha ao ler a LX02: ' + erro.message });
    }

    const pdfs = UPLOAD.coletor.filter((f) => classificarArquivo(f.name) === 'pdf');
    const txts = UPLOAD.coletor.filter((f) => classificarArquivo(f.name) === 'txt');
    let coletor;
    try {
      if (pdfs.length) {
        progressoTxt.textContent = 'Lendo o PDF da bipagem…';
        const arquivosPdf = [];
        for (let i = 0; i < pdfs.length; i++) {
          const linhas = await extrairLinhasDoPdf(pdfs[i]);
          arquivosPdf.push({ nome: pdfs[i].name, linhas });
        }
        coletor = MapaCore.processarPdf(arquivosPdf);
      } else if (txts.length) {
        progressoTxt.textContent = 'Lendo o TXT do coletor…';
        const texto = await lerTexto(txts[0]);
        coletor = MapaCore.processarTxt(texto, txts[0].name);
      } else {
        coletor = {
          registros: [], posicoes_vazias: [], alertas: [],
          problemas: [{
            tipo: 'formato_nao_suportado',
            mensagem: 'Nenhum arquivo .pdf ou .txt informado',
          }],
        };
      }
    } catch (erro) {
      coletor = {
        registros: [], posicoes_vazias: [], alertas: [],
        problemas: [{
          tipo: 'erro_leitura_coletor',
          mensagem: 'Falha ao ler o coletor: ' + erro.message,
        }],
      };
    }

    const nomesColetor = UPLOAD.coletor.map((f) => f.name).join(', ');
    const payload = MapaCore.montarPayload(coletor, lx02, {
      lx02: UPLOAD.lx02 ? UPLOAD.lx02.name : '',
      coletor: nomesColetor,
    });
    payload.marca = APP.marca;
    payload.subtitulo = APP.subtitulo;
    payload.versao = APP.versao;
    payload.gerado_em = formatarAgora();

    progresso.hidden = true;
    document.getElementById('upload-processar').disabled = false;

    const problemas = payload.problemas || [];
    if (problemas.some((p) => p.tipo === 'coluna_ausente' || p.tipo === 'erro_leitura_lx02')) {
      mostrarMsgsUpload(msgs.concat(problemas.map((p) => ({ tipo: 'erro', mensagem: p.mensagem }))));
      return;
    }

    aplicarPayload(payload);
  }

  function iniciarComDados(payload) {
    DADOS_MAPA = payload;
    ESTADO.avisosOcultos = false;
    inicializarDados();
    document.getElementById('upload').hidden = true;
    document.querySelector('header').hidden = false;
    document.getElementById('mapa').hidden = false;
    document.getElementById('rodape').hidden = false;
    document.getElementById('marca').textContent = payload.marca || APP.marca;
    document.getElementById('subtitulo').textContent =
      `Última atualização: ${payload.gerado_em || ''}`;
    document.title = payload.marca || APP.marca;
    registrarManifest();
    renderizarRodape();
    renderizarMapa();
  }

  function aplicarPayload(payload) {
    salvarSessao(payload);
    iniciarComDados(payload);
  }

  function iniciarTelaUpload() {
    if (!uploadIniciado) {
      uploadIniciado = true;
      document.getElementById('upload-lx02').addEventListener('change', (evento) => {
        adicionarArquivos(evento.target.files);
        evento.target.value = '';
      });
      document.getElementById('upload-coletor').addEventListener('change', (evento) => {
        adicionarArquivos(evento.target.files);
        evento.target.value = '';
      });
      document.getElementById('upload-processar').addEventListener('click', processarUpload);
      document.getElementById('upload-cancelar').addEventListener('click', voltarAoMapa);

      const area = document.getElementById('upload-area');
      area.addEventListener('dragover', (evento) => {
        evento.preventDefault();
        area.classList.add('sobre');
      });
      area.addEventListener('dragleave', () => area.classList.remove('sobre'));
      area.addEventListener('drop', (evento) => {
        evento.preventDefault();
        area.classList.remove('sobre');
        if (evento.dataTransfer && evento.dataTransfer.files) {
          adicionarArquivos(evento.dataTransfer.files);
        }
      });
    }
    abrirTelaUpload();
  }

  // --- Ligação dos eventos ---
  document.getElementById('busca').addEventListener('input', atualizarResultados);
  document.getElementById('busca').addEventListener('focus', atualizarResultados);
  document.getElementById('aplicar').addEventListener('click', aplicarFiltro);
  document.getElementById('limpar-filtro').addEventListener('click', limparFiltro);
  document.getElementById('botao-tema').addEventListener('click', alternarTema);
  document.getElementById('painel-fechar').addEventListener('click', fecharPainel);
  document.getElementById('painel').addEventListener('click', evento => evento.stopPropagation());
  document.addEventListener('click', fecharPainel);
  window.addEventListener('scroll', fecharPainel, true);
  document.addEventListener('keydown', evento => {
    if (evento.key === 'Escape') fecharPainel();
  });

  // Mantém as setas de "pallet fora da tela" coerentes com a rolagem.
  let tempoSinais = null;
  const agendarSinais = () => {
    if (tempoSinais) window.clearTimeout(tempoSinais);
    tempoSinais = window.setTimeout(atualizarSinaisLaterais, 60);
  };
  document.addEventListener('scroll', agendarSinais, true);

  // Reenquadra a planta ao redimensionar (desktop)
  let tempoResize = null;
  window.addEventListener('resize', () => {
    if (tempoResize) window.clearTimeout(tempoResize);
    tempoResize = window.setTimeout(() => {
      medirAlturas();
      if (DADOS_MAPA && window.matchMedia('(min-width: 1024px)').matches) zoomCaber();
      atualizarSinaisLaterais();
    }, 150);
  });

  // --- Início ---
  temaInicial();
  registrarManifest();
  document.getElementById('botao-arquivos').addEventListener('click', iniciarTelaUpload);
  if (DADOS_MAPA) {
    iniciarComDados(DADOS_MAPA);
  } else {
    const sessao = carregarSessao();
    if (sessao) iniciarComDados(sessao);
    else iniciarTelaUpload();
  }
</script>
